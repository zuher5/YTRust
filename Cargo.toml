[package]
name = "streamtube"
version = "0.8.0-ytrust"
edition = "2024"
description = "A YouTube desktop client in Rust + GPUI with SponsorBlock, DeArrow, RYD, local subscriptions & more"
license = "MIT"

[dependencies]
gpui-kit = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "socks-proxy"] }
url = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
parking_lot = "0.12"
sha2 = "0.11"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
if-addrs = { version = "0.15", features = ["link-local"] }
libloading = "0.9"
image = { version = "0.25", default-features = false }
futures = "0.3"
smallvec = "1"
rand = "0.9"
open = "5"
raw-window-handle = "0.6"
sha1 = "0.11"
# QuickJS, to solve the JavaScript challenges in YouTube stream URLs when no
# Deno or Node.js is installed; see src/api/jsc.rs
rquickjs = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
# already in the tree through GPUI; used to hide the pointer with the player controls
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# already in the tree through GPUI's Windows backend
windows = { version = "0.62", features = ["Foundation", "Media", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# already in the tree through GPUI (ashpd); MPRIS for the desktop's media widget, see src/mpris.rs
zbus = { version = "5", default-features = false, features = ["async-io"] }
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[build-dependencies]
embed-resource = "3"

# GPUI's Windows text backend with one fix: right-to-left text (Arabic, Hebrew)
# needs visual glyph ordering. See vendor/gpui-pre-windows/PATCHES.md.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# xim-ctext 0.3 with a decoder that handles non-UTF-8 compound text such as
# Cyrillic, which made typing in some Linux input methods crash the app (#248).
# See vendor/xim-ctext/Cargo.toml.
xim-ctext = { path = "vendor/xim-ctext" }
